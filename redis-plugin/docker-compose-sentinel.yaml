version: '2'

networks:
  app-tier:
    driver: bridge

services:
  redis:
    image: 'bitnamilegacy/redis:7.0.8-debian-11-r12'
    environment:
      - REDIS_REPLICATION_MODE=master
      - REDIS_PASSWORD=str0ng_passw0rd
    networks:
      - app-tier
    ports:
      - '6379'
  redis-slave:
    image: 'bitnamilegacy/redis:7.0.8-debian-11-r12'
    environment:
      - REDIS_REPLICATION_MODE=slave
      - REDIS_MASTER_HOST=redis
      - REDIS_MASTER_PASSWORD=str0ng_passw0rd
      - REDIS_PASSWORD=str0ng_passw0rd
    ports:
      - '6379'
    depends_on:
      - redis
    networks:
      - app-tier
  redis-sentinel:
    image: 'bitnamilegacy/redis-sentinel:7.0.8-debian-11-r11'
    environment:
      - REDIS_MASTER_PASSWORD=str0ng_passw0rd
      - ALLOW_EMPTY_PASSWORD=yes
    depends_on:
      - redis
      - redis-slave
    ports:
      - '26379'
    networks:
      - app-tier
