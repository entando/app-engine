name: Java CI with Maven

env:
  ENTANDO_CRANE_VERSION: v0.10.0
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  PR_TITLE: ${{ github.event.pull_request.title }}
  GIT_REPO_NAME: ${{ github.repository }}
  DOCKER_ORG: ${{ vars.DOCKER_ORG }}
  DOCKER_REPO: ${{ vars.DOCKER_REPO }}
  DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
  ACTIONS_STEP_DEBUG: true
  ENTANDO_DOCKER_BUILDS: "Dockerfile.eap:entando-de-app-eap,Dockerfile.wildfly:entando-de-app-wildfly,Dockerfile.tomcat:entando-de-app-tomcat"
on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  #~
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    - name: Configure
      run: |
        [ -f ".github/configure" ] && . .github/configure "build"

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2-

    - name: Build Java
      run: |
        (mvn org.codehaus.mojo:license-maven-plugin:2.5.0:aggregate-download-licenses &>/dev/null) &
        BKMVNPID="$!"
        
        mvn versions:set -DnewVersion="$ARTIFACT_VERSION"
        mvn -B clean package \
          -Ppre-deployment-verification \
          org.jacoco:jacoco-maven-plugin:prepare-agent \
          org.jacoco:jacoco-maven-plugin:report \
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
        ;
        
        echo ""
        echo "~> Waiting for license aggregation completion"
        wait "$BKMVNPID"

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6

    - name: Save the build output
      uses: actions/upload-artifact@v4
      with:
        name: target
        overwrite: true
        path: |
          target/*.jar
          target/generated-resources/licenses


  #~
  publish:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Restore the build output
      uses: actions/download-artifact@v4
      with:
        name: target
        path: ./target

    - name: Configure
      run: |
        [ -f ".github/configure" ] && . .github/configure "publish"

    - name: Build Docker image
      run: |
        while IFS=':' read -r -d , F N; do
          docker build -t "$DOCKER_ORG/$N:$ARTIFACT_VERSION" --build-arg VERSION="$ARTIFACT_VERSION" -f "$F" .
        done <<< "${ENTANDO_DOCKER_BUILDS},"

    - name: Publish Docker image
      run: |
        while IFS=':' read -r -d , F N; do
          .github/ppl/docker.publish \
            "$DOCKER_ORG/$N:$ARTIFACT_VERSION" \
            "${{ vars.DOCKER_REGISTRY }}" \
            "${{ secrets.DOCKER_USERNAME }}" \
            "${{ secrets.DOCKER_PASSWORD }}" \
            "$ARTIFACT_VERSION_IS_RELEASE"
        done <<< "${ENTANDO_DOCKER_BUILDS},"
